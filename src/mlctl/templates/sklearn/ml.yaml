name: iris-classifier
team: data-science
framework: sklearn
instance_type: ml.m5.large

data:
  train: s3://your-bucket/data/iris/train/
  validation: s3://your-bucket/data/iris/validation/

hyperparameters:
  max_depth: "5"
  n_estimators: "100"
  random_state: "42"

quality_gate:
  metric: accuracy
  threshold: 0.75
  direction: maximize
