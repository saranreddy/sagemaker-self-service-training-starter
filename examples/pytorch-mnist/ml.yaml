name: mnist-classifier
team: data-science
framework: pytorch
instance_type: ml.m5.large

data:
  train: s3://your-bucket/data/mnist/train/
  validation: s3://your-bucket/data/mnist/validation/

hyperparameters:
  epochs: "10"
  batch_size: "64"
  lr: "0.001"

quality_gate:
  metric: accuracy
  threshold: 0.95
  direction: maximize
